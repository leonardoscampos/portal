site_name: Leonardo Campos | DevOps Engineer Specialist
site_description: DevOps Engineer Specialist – Cloud Infrastructure, IaC, CI/CD, Containers and Observability.
site_url: https://leonardoscampos.github.io/portal/
site_author: Leonardo Campos
copyright: "© 2026 Leonardo Campos. All rights reserved."
repo_name: leonardoscampos/portal

theme:
  name: material
  custom_dir: leonardo/overrides
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font: false
  icon:
    logo: material/rocket-launch
    repo: fontawesome/brands/github
  features:
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css
  - stylesheets/about-me.css

extra_javascript:
  - javascripts/extra.js
  - javascripts/about-me.js

extra:
  generator: false
  alternate:
    - name: �🇷 Português (Brasil)
      link: /portal/
      lang: pt-BR
    - name: 🇺🇸 English
      link: /portal/en/
      lang: en
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/leonardoscampos
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/leonardoscampos
      name: LinkedIn

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang:
        - pt
        - en
  - blog
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: pt-BR
          default: true
          name: Português (Brasil)
          build: true
          site_name: "Leonardo Campos | DevOps Engineer Specialist"
        - locale: en
          name: English
          build: true
          site_name: "Leonardo Campos | DevOps Engineer Specialist"
          nav_translations:
            Home: Início
            Cloud Infrastructure: Infraestrutura Cloud
            Overview: Visão Geral
            Compute: Computação
            Storage: Armazenamento
            Networking: Rede
            Security & IAM: Segurança & IAM
            Observability: Observabilidade
            IaC & DevOps: IaC & DevOps
            CI/CD Pipelines: Pipelines CI/CD
            Service Mesh: Malha de Serviços
            Operators: Operadores
            Container Security: Segurança de Containers
            Managed Kubernetes: Kubernetes Gerenciado
            Containers & Orchestration: Containers & Orquestração
            Monitoring & Observability: Monitoramento & Observabilidade
            Alerting: Alertas
            Security & DevSecOps: Segurança & DevSecOps
            DevSecOps Pipelines: Pipelines DevSecOps
            Secrets Management: Gestão de Segredos
            Policy as Code: Política como Código
            Vulnerability Scanning: Varredura de Vulnerabilidades
            Identity & Access: Identidade & Acesso
            Supply Chain: Cadeia de Suprimentos
            Infrastructure as Code: Infraestrutura como Código
            About Me: Sobre Mim
            Guides: Guias
            Introduction: Introdução
            Advanced Topics: Tópicos Avançados
            Tutorials: Tutoriais
            Setup Guide: Guia de Configuração
            Deployment Guide: Guia de Implantação
            Blog: Blog

